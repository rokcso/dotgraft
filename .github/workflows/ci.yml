name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Static checks: shell and zsh syntax and style
  # ============================================================================
  lint:
    name: Lint shell and zsh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh shellcheck

      - name: shellcheck
        run: |
          shellcheck \
            bootstrap.sh \
            dot_local/bin/executable_dotgraft \
            tests/smoke.sh

      # Match local formatting: 2-space indent, indented case bodies, simplified syntax.
      # Use go install for shfmt because Ubuntu repositories do not package it.
      # Pin the version so @latest cannot change formatting rules and break CI.
      - name: shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          "$(go env GOPATH)/bin/shfmt" -d -i 2 -ci -sr \
            bootstrap.sh \
            dot_local/bin/executable_dotgraft \
            tests/smoke.sh

      - name: Theme contract
        run: python3 tests/theme-contract.py

      - name: zsh syntax
        run: |
          zsh -n dot_config/zsh/init.zsh
          for f in dot_config/zsh/conf.d/*.zsh; do
            zsh -n "$f"
          done
          echo "zsh 语法检查通过"
        # Check each file deliberately instead of passing one glob,
        # so failures point directly at the offending file.

  # ============================================================================
  # Render check: run the real installation flow to validate templates, choices, and Ghostty config
  # ============================================================================
  # This is the critical job: it follows the same path users take during installation:
  #   chezmoi init (answer choices) -> apply -> assert the written result
  # Template mistakes, wrong choices, and missing ignore entries all surface here.
  render:
    name: Render templates and validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi and bats
        run: brew install chezmoi bats-core

      # The cask installs an .app and does not guarantee a PATH symlink,
      # tests/smoke.sh finds the binary under /Applications itself.
      # This step must succeed; otherwise theme names and Ghostty config checks are skipped,
      # CI would look green while silently losing its most important validation.
      - name: Install Ghostty
        run: brew install --cask ghostty

      - name: Unit tests
        run: bats tests/unit

      - name: Smoke test
        run: bash tests/smoke.sh
